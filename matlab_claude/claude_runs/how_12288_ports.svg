<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1000 1110" width="1000" height="1110" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a8794"/></marker>
  </defs>
  <style>
    .t  { font-size: 14px; fill: #1f2a36; }
    .s  { font-size: 12px; fill: #5b6977; }
    .h  { font-size: 17px; font-weight: 700; fill: #1f2a36; }
    .b  { font-size: 14px; font-weight: 600; fill: #1f2a36; }
    .g  { font-size: 12px; fill: #b07a1c; font-weight: 600; }
    .code { white-space: pre; font-family: Menlo, Consolas, monospace; font-size: 12px; fill: #1f2a36; }
    .box { fill: #eef3f9; stroke: #3b4a5c; stroke-width: 1.4; }
    .gold { fill: #fbf3dc; stroke: #c8902a; stroke-width: 1.6; }
    .wire { stroke: #9aa6b2; stroke-width: 1.1; fill: none; }
    .red  { stroke: #c0392b; stroke-width: 2.4; fill: none; }
    .dash { fill: none; stroke: #9aa6b2; stroke-dasharray: 5 4; stroke-width: 1.2; }
  </style>
  <rect width="1000" height="1110" fill="#ffffff"/>

  <!-- ================= (a) whole switch ================= -->
  <text x="20" y="30" class="h">(a) The whole proposed switch at M = 128: where 12 288 comes from</text>

  <!-- first stage -->
  <text x="160" y="62" class="s" text-anchor="middle">first stage: N = 96 switches</text>
  <g>
    <rect x="100" y="75"  width="120" height="56" rx="8" class="box"/>
    <text x="160" y="99" class="b" text-anchor="middle">switch 1</text>
    <text x="160" y="118" class="s" text-anchor="middle">128 × 128</text>
    <rect x="100" y="145" width="120" height="56" rx="8" class="box"/>
    <text x="160" y="169" class="b" text-anchor="middle">switch 2</text>
    <text x="160" y="188" class="s" text-anchor="middle">128 × 128</text>
    <text x="160" y="232" class="b" text-anchor="middle">⋮</text>
    <rect x="100" y="250" width="120" height="56" rx="8" class="box"/>
    <text x="160" y="274" class="b" text-anchor="middle">switch 96</text>
    <text x="160" y="293" class="s" text-anchor="middle">128 × 128</text>
  </g>
  <!-- inputs (Tx) -->
  <g class="wire">
    <path d="M62,88 H100 M62,96 H100 M62,110 H100 M62,118 H100"/>
    <path d="M62,158 H100 M62,166 H100 M62,180 H100 M62,188 H100"/>
    <path d="M62,263 H100 M62,271 H100 M62,285 H100 M62,293 H100"/>
  </g>
  <text x="72" y="106" class="s" text-anchor="middle">⋮</text>
  <text x="72" y="176" class="s" text-anchor="middle">⋮</text>
  <text x="72" y="281" class="s" text-anchor="middle">⋮</text>
  <rect x="16" y="92" width="42" height="26" rx="6" class="box"/><text x="37" y="110" class="b" text-anchor="middle">Tx</text>
  <path d="M58,105 H100" class="red"/>
  <text x="37" y="140" class="s" text-anchor="middle">128 Tx</text>
  <text x="37" y="154" class="s" text-anchor="middle">per switch</text>

  <!-- K groups note -->
  <text x="20" y="330" class="g">K = 12 input groups:</text>
  <text x="20" y="346" class="g">1–8 = group 1, …</text>
  <text x="20" y="362" class="g">89–96 = group 12</text>

  <!-- middle stage -->
  <text x="500" y="62" class="s" text-anchor="middle">middle stage: M = 128 WR switches (built as in (b))</text>
  <rect x="420" y="75"  width="160" height="56" rx="8" class="gold"/>
  <text x="500" y="99" class="b" text-anchor="middle">WR switch 1</text>
  <text x="500" y="118" class="s" text-anchor="middle">96 × 96</text>
  <rect x="420" y="145" width="160" height="56" rx="8" class="gold"/>
  <text x="500" y="169" class="b" text-anchor="middle">WR switch 2</text>
  <text x="500" y="188" class="s" text-anchor="middle">96 × 96</text>
  <text x="500" y="232" class="b" text-anchor="middle">⋮</text>
  <rect x="420" y="250" width="160" height="56" rx="8" class="gold"/>
  <text x="500" y="274" class="b" text-anchor="middle">WR switch 128</text>
  <text x="500" y="293" class="s" text-anchor="middle">96 × 96</text>

  <!-- wires stage1 -> WR : output m of every first-stage switch goes to WR switch m -->
  <g class="wire">
    <path d="M220,113 L420,173"/><path d="M220,123 L420,283"/>
    <path d="M220,163 L420,108"/><path d="M220,173 L420,178"/><path d="M220,183 L420,288"/>
    <path d="M220,268 L420,118"/><path d="M220,278 L420,188"/><path d="M220,288 L420,293"/>
  </g>
  <path d="M220,103 L420,98" class="red"/>
  <text x="320" y="322" class="s" text-anchor="middle">output m of every first-stage</text>
  <text x="320" y="337" class="s" text-anchor="middle">switch → WR switch m</text>
  <text x="320" y="352" class="s" text-anchor="middle">(128 outputs → 128 WR switches)</text>

  <!-- third stage -->
  <text x="830" y="62" class="s" text-anchor="middle">third stage: N = 96 switches</text>
  <rect x="770" y="75"  width="120" height="56" rx="8" class="box"/>
  <text x="830" y="99" class="b" text-anchor="middle">switch 1</text>
  <text x="830" y="118" class="s" text-anchor="middle">128 × 128 · A2</text>
  <rect x="770" y="145" width="120" height="56" rx="8" class="box"/>
  <text x="830" y="169" class="b" text-anchor="middle">switch 2</text>
  <text x="830" y="188" class="s" text-anchor="middle">128 × 128 · A2</text>
  <text x="830" y="232" class="b" text-anchor="middle">⋮</text>
  <rect x="770" y="250" width="120" height="56" rx="8" class="box"/>
  <text x="830" y="274" class="b" text-anchor="middle">switch 96</text>
  <text x="830" y="293" class="s" text-anchor="middle">128 × 128 · A2</text>

  <g class="wire">
    <path d="M580,98 L770,108"/><path d="M580,118 L770,283"/>
    <path d="M580,163 L770,103"/><path d="M580,173 L770,173"/><path d="M580,183 L770,288"/>
    <path d="M580,268 L770,113"/><path d="M580,278 L770,183"/><path d="M580,293 L770,293"/>
  </g>
  <path d="M580,108 L770,163" class="red"/>
  <text x="675" y="322" class="s" text-anchor="middle">output j of every WR switch</text>
  <text x="675" y="337" class="s" text-anchor="middle">→ third-stage switch j</text>
  <text x="675" y="352" class="s" text-anchor="middle">(96 outputs → 96 switches)</text>

  <!-- outputs Rx -->
  <g class="wire">
    <path d="M890,88 H935 M890,96 H935 M890,110 H935 M890,118 H935"/>
    <path d="M890,158 H935 M890,166 H935 M890,180 H935 M890,188 H935"/>
    <path d="M890,263 H935 M890,271 H935 M890,285 H935 M890,293 H935"/>
  </g>
  <path d="M890,173 H940" class="red" marker-end="url(#arr)"/>
  <rect x="942" y="160" width="44" height="26" rx="6" class="box"/><text x="964" y="178" class="b" text-anchor="middle">Rx</text>
  <text x="964" y="210" class="s" text-anchor="middle">128 Rx</text>
  <text x="964" y="224" class="s" text-anchor="middle">per switch</text>

  <!-- the formula -->
  <rect x="210" y="380" width="580" height="92" rx="10" fill="#fff6f4" stroke="#c0392b" stroke-width="1.6"/>
  <text x="500" y="412" text-anchor="middle" style="font-size:22px;font-weight:700;fill:#1f2a36">ports = N × M = 96 × 128 = 12 288</text>
  <text x="500" y="436" class="t" text-anchor="middle">96 first-stage switches, each with M = 128 transmitter ports (and the same at the receivers)</text>
  <text x="500" y="458" class="code" text-anchor="middle">MATLAB: p.N = 96;  list_sw_size = [16 32 64 128];  ports = p.sw_size * N   → 12288</text>

  <!-- ================= (b) inside one WR switch ================= -->
  <line x1="20" y1="492" x2="980" y2="492" stroke="#e2e7ec"/>
  <text x="20" y="520" class="h">(b) Inside one WR switch (96 × 96) with K = 12</text>

  <rect x="60" y="535" width="870" height="230" rx="10" class="gold" fill-opacity="0.6"/>
  <!-- branch 1 -->
  <g class="wire"><path d="M90,565 L140,583 M90,575 L140,585 M90,595 L140,589 M90,605 L140,591"/></g>
  <text x="100" y="590" class="s">⋮</text>
  <circle cx="160" cy="587" r="18" fill="#fff" stroke="#3b4a5c" stroke-width="1.4"/>
  <path d="M178,587 H250" class="red"/>
  <path d="M250,571 L282,587 L250,603 Z" fill="#fff" stroke="#3b4a5c" stroke-width="1.4"/>
  <path d="M282,587 H330" class="red"/>
  <rect x="330" y="570" width="40" height="34" rx="5" fill="#fff" stroke="#3b4a5c" stroke-width="1.4"/>
  <path d="M340,587 H352 M352,587 L362,579 M352,587 L362,595" stroke="#3b4a5c" stroke-width="1.4" fill="none"/>
  <!-- branch 2 -->
  <g class="wire"><path d="M90,630 L140,648 M90,640 L140,650 M90,660 L140,654 M90,670 L140,656"/></g>
  <circle cx="160" cy="652" r="18" fill="#fff" stroke="#3b4a5c" stroke-width="1.4"/>
  <path d="M178,652 H250" class="wire"/>
  <path d="M250,636 L282,652 L250,668 Z" fill="#fff" stroke="#3b4a5c" stroke-width="1.4"/>
  <path d="M282,652 H330" class="wire"/>
  <rect x="330" y="635" width="40" height="34" rx="5" fill="#fff" stroke="#3b4a5c" stroke-width="1.4"/>
  <path d="M340,652 H352 M352,652 L362,644 M352,652 L362,660" stroke="#3b4a5c" stroke-width="1.4" fill="none"/>
  <text x="160" y="690" class="b" text-anchor="middle">⋮</text>
  <text x="266" y="690" class="b" text-anchor="middle">⋮</text>
  <text x="350" y="690" class="b" text-anchor="middle">⋮</text>
  <!-- branch 12 -->
  <g class="wire"><path d="M90,700 L140,718 M90,710 L140,720 M90,730 L140,724 M90,740 L140,726"/></g>
  <circle cx="160" cy="722" r="18" fill="#fff" stroke="#3b4a5c" stroke-width="1.4"/>
  <path d="M178,722 H250" class="wire"/>
  <path d="M250,706 L282,722 L250,738 Z" fill="#fff" stroke="#3b4a5c" stroke-width="1.4"/>
  <path d="M282,722 H330" class="wire"/>
  <rect x="330" y="705" width="40" height="34" rx="5" fill="#fff" stroke="#3b4a5c" stroke-width="1.4"/>
  <path d="M340,722 H352 M352,722 L362,714 M352,722 L362,730" stroke="#3b4a5c" stroke-width="1.4" fill="none"/>

  <!-- AWG pair -->
  <path d="M520,575 L600,550 L600,640 L520,615 Z" fill="#fff" stroke="#3b4a5c" stroke-width="1.4"/>
  <text x="566" y="600" class="b" text-anchor="middle">odd</text>
  <path d="M520,685 L600,660 L600,750 L520,725 Z" fill="#fff" stroke="#3b4a5c" stroke-width="1.4"/>
  <text x="566" y="710" class="b" text-anchor="middle">even</text>
  <g class="wire">
    <path d="M370,652 L520,600"/><path d="M370,652 L520,700"/>
    <path d="M370,722 L520,610"/><path d="M370,722 L520,715"/>
    <path d="M370,587 L520,690"/>
  </g>
  <path d="M370,587 L520,590" class="red"/>
  <g class="wire">
    <path d="M600,560 H650 M600,575 H650 M600,615 H650 M600,630 H650"/>
    <path d="M600,670 H650 M600,685 H650 M600,725 H650 M600,740 H650"/>
  </g>
  <path d="M600,595 H660" class="red" marker-end="url(#arr)"/>
  <text x="625" y="652" class="s">⋮</text>

  <!-- labels for (b) -->
  <text x="160" y="558" class="s" text-anchor="middle">8 × 1 coupler</text>
  <text x="266" y="560" class="s" text-anchor="middle">EDFA</text>
  <text x="350" y="560" class="s" text-anchor="middle">1 × 2 splitter</text>
  <text x="560" y="545" class="s" text-anchor="middle">ULCF AWG pair, 12 inputs each</text>
  <text x="75" y="758" class="s">8 inputs per branch</text>
  <g class="t">
    <text x="690" y="570" class="b">Counting the WR switch</text>
    <text x="690" y="594">12 branches × 8 inputs = 96 inputs</text>
    <text x="690" y="614">one input from each first-stage switch</text>
    <text x="690" y="634">odd + even channels → 96 outputs</text>
    <text x="690" y="654">one output to each third-stage switch</text>
    <text x="690" y="684" class="b">Why it helps the power</text>
    <text x="690" y="706">coupler before the EDFA: 8 × 1</text>
    <text x="690" y="726">instead of 96 × 1 → about 14 dB less loss</text>
    <text x="690" y="746" class="s">(conventional: one 96 × 1 coupler, 24.5 dB)</text>
  </g>

  <!-- ================= (c) MATLAB search ================= -->
  <line x1="20" y1="785" x2="980" y2="785" stroke="#e2e7ec"/>
  <text x="20" y="813" class="h">(c) How MATLAB decides that 12 288 ports work: raise PTx until BER ≤ 1e-2</text>

  <rect x="20" y="828" width="455" height="214" rx="8" fill="#f6f8fa" stroke="#d5dce3"/>
  <text x="34" y="850" class="code" style="fill:#5b6977">% claude_main_three_stage_proposed.m (simplified)</text>
  <text x="34" y="870" class="code">for M = [16 32 64 128]             % p.sw_size</text>
  <text x="34" y="888" class="code">  for PTx = -25:1:10               % dBm, step 1</text>
  <text x="34" y="906" class="code">    r = claude_chain_proposed(p);  % one target</text>
  <text x="34" y="924" class="code">                                   % signal, Tx→Rx</text>
  <text x="34" y="942" class="code">    if r.BER &lt;= BER_limit          % 1e-2 (FEC)</text>
  <text x="34" y="960" class="code">      required_PTx = PTx; break</text>
  <text x="34" y="978" class="code">    end</text>
  <text x="34" y="996" class="code">  end</text>
  <text x="34" y="1014" class="code">  ports = M * N                    % 128*96 = 12288</text>
  <text x="34" y="1032" class="code">end</text>

  <!-- chart: x PTx -16..11 → 520..960 ; y log10 BER -1.3..-2.3 → 850..1010 -->
  <rect x="520" y="850" width="440" height="160" fill="#fff" stroke="#d5dce3"/>
  <g stroke="#eef1f4">
    <line x1="520" y1="913.8" x2="960" y2="913.8"/>
    <line x1="617.8" y1="850" x2="617.8" y2="1010"/><line x1="699.3" y1="850" x2="699.3" y2="1010"/><line x1="780.8" y1="850" x2="780.8" y2="1010"/>
  </g>
  <!-- FEC limit -->
  <line x1="520" y1="962" x2="960" y2="962" stroke="#c0392b" stroke-dasharray="6 4" stroke-width="1.4"/>
  <text x="955" y="956" class="s" text-anchor="end" style="fill:#c0392b">FEC limit BER = 1e-2</text>
  <!-- 5 dBm line -->
  <line x1="862.3" y1="850" x2="862.3" y2="1010" stroke="#7a8794" stroke-dasharray="2 3"/>
  <text x="866" y="1004" class="s">5-dBm limit</text>
  <!-- y ticks -->
  <g class="s" text-anchor="end">
    <text x="514" y="854">5e-2</text><text x="514" y="918">2e-2</text><text x="514" y="966">1e-2</text><text x="514" y="1013">5e-3</text>
  </g>
  <!-- x ticks -->
  <g class="s" text-anchor="middle">
    <text x="536.3" y="1026">-15</text><text x="617.8" y="1026">-10</text><text x="699.3" y="1026">-5</text><text x="780.8" y="1026">0</text><text x="862.3" y="1026">5</text><text x="943.8" y="1026">10</text>
  </g>
  <text x="740" y="1044" class="s" text-anchor="middle">transmitter power PTx (dBm)</text>
  <text x="500" y="842" class="s" text-anchor="end">BER</text>

  <!-- proposed K=12 A2 dispersed M=128 -->
  <polyline points="536.3,915.4 552.6,937.4 568.9,959.6 585.2,978.3" fill="none" stroke="#c0392b" stroke-width="2"/>
  <g fill="#c0392b"><circle cx="536.3" cy="915.4" r="4"/><circle cx="552.6" cy="937.4" r="4"/><circle cx="568.9" cy="959.6" r="4"/></g>
  <circle cx="585.2" cy="978.3" r="7" fill="#fff" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="585.2" cy="978.3" r="3" fill="#c0392b"/>
  <text x="598" y="992" class="b" style="fill:#c0392b;font-size:13px">−12 dBm: first BER below the limit</text>
  <text x="560" y="900" class="s" style="fill:#c0392b">proposed, K = 12</text>

  <!-- conventional K=1 A2 M=128 -->
  <polyline points="846,860.6 862.3,863.9 878.6,866.2 894.9,868.1 911.2,869.7 927.5,871 943.8,872.2" fill="none" stroke="#7a8794" stroke-width="2"/>
  <g fill="#7a8794"><circle cx="846" cy="860.6" r="3.5"/><circle cx="862.3" cy="863.9" r="3.5"/><circle cx="878.6" cy="866.2" r="3.5"/><circle cx="894.9" cy="868.1" r="3.5"/><circle cx="911.2" cy="869.7" r="3.5"/><circle cx="927.5" cy="871" r="3.5"/><circle cx="943.8" cy="872.2" r="3.5"/></g>
  <text x="840" y="892" class="s" text-anchor="end">conventional (K = 1):</text>
  <text x="840" y="906" class="s" text-anchor="end">never reaches 1e-2 → NaN</text>

  <!-- verdict -->
  <rect x="20" y="1052" width="960" height="52" rx="8" fill="#fff6f4" stroke="#c0392b" stroke-width="1.2"/>
  <text x="500" y="1073" class="b" text-anchor="middle">Result for M = 128 (12 288 ports), Scheme A2, dispersed traffic</text>
  <text x="500" y="1094" class="t" text-anchor="middle">proposed K = 12: works at −12 dBm ✓      conventional: infeasible, BER ≈ 3.6e-2 even at 10 dBm ✗</text>
</svg>
