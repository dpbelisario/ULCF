<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="760" viewBox="0 0 1060 760" font-family="Segoe UI, Arial, sans-serif">
<defs>
<marker id="ar_red" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 z" fill="#C0392B"/></marker>
<marker id="ar_or" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 z" fill="#B9770E"/></marker>
<marker id="ar_gry" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 z" fill="#7F8C8D"/></marker>
</defs>
<style>
  .lbl { font-size: 13px; fill: #7F8C8D; }
  .txt { font-size: 14px; fill: #222222; }
  .bold { font-size: 14px; fill: #222222; font-weight: bold; }
  .ttl { font-size: 16px; fill: #222222; font-weight: bold; }
  .leak { stroke: #B9770E; stroke-width: 1.6; fill: none; stroke-dasharray: 5 5; animation: flow 1.1s linear infinite; }
  .sig { stroke: #C0392B; stroke-width: 2.6; fill: none; }
  @keyframes flow { to { stroke-dashoffset: -20; } }
  @keyframes blink { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  .blink { animation: blink 2.2s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .leak, .blink { animation: none; } }
</style>
<rect x="0" y="0" width="1060" height="760" fill="white"/>

<!-- ============ (a) ============ -->
<text x="30" y="36" class="ttl">(a) Where the new block comes from: the other K − 1 input ports of the ULCF AWG</text>
<text x="30" y="58" class="lbl">K = 12. Every group's EDFA feeds one input port. A signal on the same wavelength λj can sit at every port.</text>

<!-- inputs -->
<text x="40" y="104" class="bold">group 1</text>
<text x="40" y="120" class="lbl">target, λj</text>
<polyline points="130,108 455,108" class="sig" marker-end="url(#ar_red)"/>
<text x="350" y="100" class="lbl">input 1</text>

<text x="40" y="160" class="bold">group 2</text>
<text x="40" y="176" class="lbl">also λj</text>
<polyline points="130,164 455,164" class="leak" marker-end="url(#ar_or)"/>
<text x="350" y="156" class="lbl">input 2</text>

<text x="40" y="216" class="bold">group 3</text>
<text x="40" y="232" class="lbl">also λj</text>
<polyline points="130,220 455,220" class="leak" marker-end="url(#ar_or)"/>
<text x="350" y="212" class="lbl">input 3</text>

<text x="200" y="262" class="bold" text-anchor="middle">⋮</text>

<text x="40" y="302" class="bold">group 12</text>
<text x="40" y="318" class="lbl">also λj</text>
<polyline points="130,306 455,306" class="leak" marker-end="url(#ar_or)"/>
<text x="350" y="298" class="lbl">input K</text>

<!-- AWG -->
<polygon points="460,90 600,140 600,280 460,330" fill="#FDF3D9" stroke="#B9770E" stroke-width="1.8" stroke-linejoin="round"/>
<text x="530" y="200" text-anchor="middle" class="bold">ULCF AWG</text>
<text x="530" y="218" text-anchor="middle" class="lbl">K inputs</text>

<!-- output j -->
<polyline points="600,176 820,176" class="sig" marker-end="url(#ar_red)"/>
<polyline points="600,190 820,190" class="leak" marker-end="url(#ar_or)"/>
<text x="610" y="168" class="lbl">output j</text>
<text x="830" y="172" class="bold">target</text>
<text x="830" y="196" class="txt" fill="#B9770E" style="fill:#B9770E">+ 11 weak copies</text>
<text x="830" y="214" class="lbl">each 32 dB below</text>
<text x="830" y="230" class="lbl">(AWG_XT = 32 dB)</text>
<!-- other outputs -->
<polyline points="600,150 680,150" fill="none" stroke="#7F8C8D" stroke-width="1.4" marker-end="url(#ar_gry)"/>
<polyline points="600,230 680,230" fill="none" stroke="#7F8C8D" stroke-width="1.4" marker-end="url(#ar_gry)"/>
<polyline points="600,260 680,260" fill="none" stroke="#7F8C8D" stroke-width="1.4" marker-end="url(#ar_gry)"/>

<text x="530" y="356" text-anchor="middle" class="lbl">The AWG routes input 1 → output j cleanly, but each other input still leaks a little light to output j.</text>

<!-- moving pulses -->
<circle r="7" fill="#C0392B">
  <animateMotion dur="3s" repeatCount="indefinite" path="M130,108 L460,108 L530,176 L820,176"/>
</circle>
<circle r="4" fill="#B9770E" opacity="0.7">
  <animateMotion dur="3s" repeatCount="indefinite" path="M130,164 L460,164 L530,190 L820,190"/>
</circle>
<circle r="4" fill="#B9770E" opacity="0.7">
  <animateMotion dur="3s" begin="0.4s" repeatCount="indefinite" path="M130,220 L460,220 L530,190 L820,190"/>
</circle>
<circle r="4" fill="#B9770E" opacity="0.7">
  <animateMotion dur="3s" begin="0.8s" repeatCount="indefinite" path="M130,306 L460,306 L530,190 L820,190"/>
</circle>

<line x1="30" y1="380" x2="1030" y2="380" stroke="#E5E8EB"/>

<!-- ============ (b) power bars ============ -->
<text x="30" y="414" class="ttl">(b) What output j carries, in dB below the target</text>
<!-- axis: 0 dB at y=450, -40 dB at y=690 ; 6 px per dB -->
<g font-size="12" fill="#7F8C8D" text-anchor="end">
  <text x="96" y="454">0 dB</text><text x="96" y="514">−10</text><text x="96" y="574">−20</text><text x="96" y="634">−30</text><text x="96" y="694">−40</text>
</g>
<g stroke="#EEF1F4"><line x1="104" y1="450" x2="520" y2="450"/><line x1="104" y1="510" x2="520" y2="510"/><line x1="104" y1="570" x2="520" y2="570"/><line x1="104" y1="630" x2="520" y2="630"/><line x1="104" y1="690" x2="520" y2="690"/></g>
<!-- target bar: 0 dB, from bottom 690 to 450 -->
<rect x="130" y="450" width="80" height="240" fill="#C0392B" opacity="0.85"/>
<text x="170" y="712" text-anchor="middle" class="txt">target</text>
<!-- one leak: -32 dB -> y = 450+192 = 642 -->
<rect x="250" y="642" width="80" height="48" fill="#B9770E" opacity="0.55"/>
<text x="290" y="636" text-anchor="middle" class="bold" style="fill:#B9770E">−32</text>
<text x="290" y="712" text-anchor="middle" class="txt">one leak</text>
<!-- eleven leaks together: -32+10.4 = -21.6 -> y=450+129.6=579.6 -->
<rect x="390" y="579.6" width="80" height="110.4" fill="#B9770E" class="blink"/>
<text x="430" y="573" text-anchor="middle" class="bold" style="fill:#B9770E">−21.6</text>
<text x="430" y="712" text-anchor="middle" class="txt">all 11 leaks</text>
<text x="430" y="728" text-anchor="middle" class="lbl">added together</text>
<!-- bracket -->
<path d="M340,642 C360,642 360,580 382,580" fill="none" stroke="#7F8C8D" stroke-width="1.2" marker-end="url(#ar_gry)"/>
<text x="318" y="604" class="lbl" text-anchor="end">× 11 = +10.4 dB</text>

<!-- explanation column -->
<g>
<text x="570" y="456" class="bold">Why it matters</text>
<text x="570" y="480" class="txt">The leaks sit on exactly the target's wavelength,</text>
<text x="570" y="498" class="txt">so no filter and no receiver can remove them.</text>
<text x="570" y="516" class="txt">They act like noise about 21.5 dB below the signal</text>
<text x="570" y="534" class="txt">(the budget says 21.4 dB at K = 12).</text>
<text x="570" y="566" class="txt">That is lower than every other noise term of the</text>
<text x="570" y="584" class="txt">proposed switch, so this block becomes the limit.</text>

<text x="570" y="624" class="bold">K = 1 (today's switch)</text>
<text x="570" y="648" class="txt">One input port → nothing to leak → the block</text>
<text x="570" y="666" class="txt">does nothing. It must not even create a leak</text>
<text x="570" y="684" class="txt">waveform, or the random numbers of every later</text>
<text x="570" y="702" class="txt">block shift and the BER is no longer 8.700e-03.</text>
</g>
</svg>
