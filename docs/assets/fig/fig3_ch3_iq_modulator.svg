<text x="490.0" y="530" font-family="Noto Sans CJK JP, sans-serif" font-size="15" text-anchor="middle" fill="#222">At null bias:  E_out ∝ sin(πV_I/2V_π) + j·sin(πV_Q/2V_π) ≈ I(t) + jQ(t)  (small-signal)</text>
