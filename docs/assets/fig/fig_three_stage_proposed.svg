</defs>
<rect x="0" y="0" width="1010" height="600" fill="white"/>
<text x="505" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="20" text-anchor="middle" fill="#222" font-weight="bold">Proposed three-stage switch: one middle-stage module and its neighbors</text>
<!-- column headers -->
<text x="20" y="62" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="start" fill="#222" font-weight="bold">First stage</text>
<text x="20" y="81" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#7F8C8D">N space switches (M x M)</text>
<text x="20" y="98" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#7F8C8D">each: one fiber to every module</text>
<text x="480" y="62" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#B7791F" font-weight="bold">Middle stage: M identical modules (N x N wavelength-routing switches)</text>
<text x="480" y="81" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#7F8C8D">one module: K rows, one per input group; each row = coupler + EDFA + 1 x 2 splitter</text>
<text x="990" y="62" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="end" fill="#222" font-weight="bold">Third stage</text>
<text x="990" y="81" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="end" fill="#7F8C8D">N space switches (M x M)</text>
<text x="990" y="98" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="end" fill="#7F8C8D">each: one fiber from every module</text>
<!-- module frames: two modules behind, one in front -->
<rect x="232" y="100" width="536" height="424" rx="12" fill="white" stroke="#B7791F" stroke-width="1.4" stroke-opacity="0.55" stroke-dasharray="8,5"/>
