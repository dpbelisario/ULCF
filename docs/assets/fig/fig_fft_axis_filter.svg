<rect x="0" y="0" width="1100" height="640" fill="white"/>
<text x="550" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="20" text-anchor="middle" fill="#222" font-weight="bold">Filtering = multiplying the spectrum by a mask (example: Nyquist pulse shaping, up = 4)</text>
<rect x="25" y="62" width="210" height="64" rx="8" fill="#F2F6FB" stroke="#34495E" stroke-width="1.8"/>
<text x="130" y="89" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#222" font-weight="bold">time samples x</text>
<text x="130" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#555">nsamp x 1 column</text>
<rect x="305" y="62" width="210" height="64" rx="8" fill="#F2F6FB" stroke="#34495E" stroke-width="1.8"/>
<text x="410" y="89" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#222" font-weight="bold">spectrum X</text>
<text x="410" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#555">nsamp bins, 0 Hz in the middle</text>
<text x="410" y="147" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#7F8C8D">X = fftshift(fft(x))</text>
<rect x="585" y="62" width="210" height="64" rx="8" fill="#FDF4DC" stroke="#B7791F" stroke-width="1.8"/>
<text x="690" y="89" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#222" font-weight="bold">multiply by the mask H</text>
<text x="690" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#555">bin by bin: this is the filter</text>
<text x="690" y="147" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#7F8C8D">Y = H .* X</text>
<rect x="865" y="62" width="210" height="64" rx="8" fill="#F2F6FB" stroke="#34495E" stroke-width="1.8"/>
<text x="970" y="89" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#222" font-weight="bold">time samples y</text>
<text x="970" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#555">nsamp x 1 column</text>
<text x="970" y="147" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#7F8C8D">y = ifft(ifftshift(Y))</text>
<line x1="235" y1="94" x2="302" y2="94" stroke="#1F4E79" stroke-width="2.6" marker-end="url(#ar_nav)"/>
<line x1="515" y1="94" x2="582" y2="94" stroke="#1F4E79" stroke-width="2.6" marker-end="url(#ar_nav)"/>
