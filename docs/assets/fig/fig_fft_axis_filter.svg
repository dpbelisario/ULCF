<text x="25" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="start" fill="#222" font-weight="bold">What happens on the frequency axis</text>
<text x="1004" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="end" fill="#7F8C8D">f = freq_axis(nsamp, Fs): one value (bin) every Fs/nsamp</text>
