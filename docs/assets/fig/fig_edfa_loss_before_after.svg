<text x="682" y="319" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#B7791F" font-weight="bold">EDFA input</text>
<text x="682" y="339" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#B7791F" font-weight="bold">−20 dBm</text>
<text x="828" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#C0392B">0 dBm</text>
<text x="828" y="411" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1F4E79">ASE −27.9 dBm</text>
<text x="1016" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#C0392B">−10 dBm</text>
<text x="998" y="461" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1F4E79">ASE −37.9 dBm</text>
<line x1="936" y1="312" x2="936" y2="427" stroke="#B7791F" stroke-width="2.2"/>
<polygon points="936,304 931,314 941,314" fill="#B7791F"/>
<polygon points="936,435.4 931,425.4 941,425.4" fill="#B7791F"/>
<rect x="948" y="345" width="88" height="50" rx="6" fill="#FDF4DC" stroke="#B7791F" stroke-width="1.5"/>
<text x="992" y="365" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#B7791F" font-weight="bold">SNR</text>
<text x="992" y="386" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#B7791F" font-weight="bold">27.9 dB</text>
<text x="845" y="507" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#34495E">Signal and ASE fall together: the SNR does not change.</text>

<!-- ================= legend ================= -->
<line x1="60" y1="555" x2="104" y2="555" stroke="#C0392B" stroke-width="3"/>
<text x="112" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="start" fill="#222">signal power of one channel</text>
<line x1="360" y1="555" x2="404" y2="555" stroke="#1F4E79" stroke-width="2.6" stroke-dasharray="8,5"/>
<text x="412" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="start" fill="#222">ASE power inside the signal bandwidth (32 GHz)</text>
<circle cx="820" cy="555" r="6" fill="#B7791F" stroke="white" stroke-width="1.5"/>
<text x="832" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="start" fill="#222">power at the EDFA input</text>
<text x="60" y="592" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="start" fill="#7F8C8D">Example: EDFA with gain G = 20 dB and noise figure NF = 6 dB. All powers are for one channel, both polarizations together.</text>
</svg>
