<line x1="910" y1="190" x2="910" y2="475" stroke="#BDC3C7" stroke-width="1.2" stroke-dasharray="3,4"/>
<line x1="620" y1="225" x2="620" y2="475" stroke="#34495E" stroke-width="1.5"/>
<text x="613" y="255" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="end" fill="#555">0</text>
<text x="613" y="305" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="end" fill="#555">−10</text>
<text x="613" y="355" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="end" fill="#555">−20</text>
<text x="613" y="405" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="end" fill="#555">−30</text>
<text x="613" y="455" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="end" fill="#555">−40</text>
<text x="575" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#555" transform="rotate(-90 575 350)">Power [dBm]</text>
<polyline points="747,389.4 910,389.4 910,439.4 1070,439.4" fill="none" stroke="#1F4E79" stroke-width="2.6" stroke-dasharray="8,5"/>
<polyline points="620,350 747,350 747,250 910,250 910,300 1070,300" fill="none" stroke="#C0392B" stroke-width="3" stroke-linejoin="round"/>
