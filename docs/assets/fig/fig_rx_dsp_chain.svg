<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430">
<defs>
  <marker id="ar_opt" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 z" fill="#C0392B"/></marker>
  <marker id="ar_ele" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 z" fill="#1F4E79"/></marker>
  <marker id="ar_amb" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 z" fill="#B7791F"/></marker>
  <marker id="ar_gry" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 z" fill="#7F8C8D"/></marker>
</defs>
<rect x="0" y="0" width="1100" height="430" fill="white"/>
<text x="550" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="20" text-anchor="middle" fill="#222" font-weight="bold">Receiver processing in the simulation</text>

<!-- ================= sample-rate brackets above the chain ================= -->
<line x1="216" y1="84" x2="434" y2="84" stroke="#7F8C8D" stroke-width="1.4"/>
<line x1="216" y1="79" x2="216" y2="89" stroke="#7F8C8D" stroke-width="1.4"/>
<line x1="434" y1="79" x2="434" y2="89" stroke="#7F8C8D" stroke-width="1.4"/>
<text x="325" y="74" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#7F8C8D">up samples per symbol</text>
<line x1="616" y1="84" x2="834" y2="84" stroke="#7F8C8D" stroke-width="1.4"/>
<line x1="616" y1="79" x2="616" y2="89" stroke="#7F8C8D" stroke-width="1.4"/>
<line x1="834" y1="79" x2="834" y2="89" stroke="#7F8C8D" stroke-width="1.4"/>
<text x="725" y="74" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#7F8C8D">1 sample per symbol</text>

<!-- ================= the chain ================= -->
<line x1="14" y1="140" x2="58" y2="140" stroke="#C0392B" stroke-width="3" marker-end="url(#ar_opt)"/>
<text x="34" y="126" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#C0392B">light</text>
<rect x="60" y="100" width="150" height="80" rx="8" fill="white" stroke="#34495E" stroke-width="1.8" stroke-dasharray="6,4"/>
<text x="135" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">Coherent</text>
<text x="135" y="147" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">detection</text>
<text x="135" y="167" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#555">LO, hybrid, detectors</text>
<text x="135" y="202" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#7F8C8D">ideal: no code</text>

<line x1="210" y1="140" x2="248" y2="140" stroke="#1F4E79" stroke-width="3" marker-end="url(#ar_ele)"/>
<rect x="250" y="100" width="150" height="80" rx="8" fill="#F2F6FB" stroke="#34495E" stroke-width="1.8"/>
<text x="325" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#222" font-weight="bold">Receive filter</text>
<text x="325" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#555">width = baud rate</text>
<text x="325" y="202" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#7F8C8D">nyquistfilter, apply_filter</text>

<line x1="400" y1="140" x2="438" y2="140" stroke="#1F4E79" stroke-width="3" marker-end="url(#ar_ele)"/>
<rect x="440" y="100" width="170" height="80" rx="8" fill="#F2F6FB" stroke="#34495E" stroke-width="1.8"/>
<text x="525" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#222" font-weight="bold">Adaptive equalizer</text>
<text x="525" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#555">Morder + 1 = 17 taps</text>
<text x="540" y="202" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#7F8C8D">adequalizet</text>

<line x1="610" y1="140" x2="648" y2="140" stroke="#1F4E79" stroke-width="3" marker-end="url(#ar_ele)"/>
<rect x="650" y="100" width="150" height="80" rx="8" fill="#F2F6FB" stroke="#34495E" stroke-width="1.8"/>
<text x="725" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#222" font-weight="bold">Decision</text>
<text x="725" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#555">closest constellation point</text>
<text x="725" y="202" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#7F8C8D">my_qamdemod</text>
<text x="725" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#7F8C8D">(called by measure_BER_QAM)</text>

<line x1="800" y1="140" x2="838" y2="140" stroke="#1F4E79" stroke-width="3" marker-end="url(#ar_ele)"/>
<rect x="840" y="100" width="150" height="80" rx="8" fill="#F2F6FB" stroke="#34495E" stroke-width="1.8"/>
<text x="915" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#222" font-weight="bold">Bit-error count</text>
<text x="915" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#555">received bits ≠ sent bits</text>
<text x="893" y="202" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#7F8C8D">measure_BER_QAM</text>

<line x1="990" y1="140" x2="1034" y2="140" stroke="#1F4E79" stroke-width="3" marker-end="url(#ar_ele)"/>
<text x="1042" y="146" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="start" fill="#1F4E79" font-weight="bold">BER</text>

<!-- ================= the transmitted symbols: who uses which part ================= -->
<text x="238" y="317" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="end" fill="#222" font-weight="bold">transmitted symbols</text>
<text x="238" y="335" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="end" fill="#7F8C8D">data_mod, data (from TL_QAM)</text>
<rect x="250" y="296" width="247" height="48" fill="#FDF4DC" stroke="#B7791F" stroke-width="1.8"/>
<rect x="497" y="296" width="493" height="48" fill="#F2F6FB" stroke="#34495E" stroke-width="1.8"/>
<text x="373" y="325" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#B7791F" font-weight="bold">symbols 1 … 10000</text>
<text x="743" y="325" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">symbols 10001 … 30000</text>
<text x="373" y="364" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#B7791F">training: the taps adapt</text>
<text x="743" y="364" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#34495E">taps frozen: only these symbols are counted in the BER</text>
<text x="620" y="398" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#7F8C8D">example: datasize = 30000, training_num = floor(datasize/3) = 10000</text>

<line x1="470" y1="296" x2="470" y2="184" stroke="#B7791F" stroke-width="2.4" marker-end="url(#ar_amb)"/>
<text x="462" y="255" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="end" fill="#B7791F">known symbols</text>
<text x="462" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="end" fill="#7F8C8D">data_mod(1:training_num)</text>
<line x1="970" y1="296" x2="970" y2="184" stroke="#7F8C8D" stroke-width="2.4" marker-end="url(#ar_gry)"/>
<text x="962" y="255" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="end" fill="#34495E">sent bits of these symbols</text>
<text x="962" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="end" fill="#7F8C8D">data(mod_flag*training_num+1:end)</text>
</svg>
